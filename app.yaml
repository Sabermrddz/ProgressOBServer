name: webetu-bot
services:
- name: webetu-bot
  github:
    repo: YOUR_GITHUB_USERNAME/ProgressOBSe
    branch: main
  dockerfile_path: Dockerfile
  envs:
  - key: WEBETU_USERNAME
    scope: RUN_TIME
    value: ${WEBETU_USERNAME}
  - key: WEBETU_PASSWORD
    scope: RUN_TIME
    value: ${WEBETU_PASSWORD}
  - key: DIA_ID
    scope: RUN_TIME
    value: ${DIA_ID}
  - key: IND_ID
    scope: RUN_TIME
    value: ${IND_ID}
  - key: TELEGRAM_BOT_TOKEN
    scope: RUN_TIME
    value: ${TELEGRAM_BOT_TOKEN}
  - key: TELEGRAM_CHAT_ID
    scope: RUN_TIME
    value: ${TELEGRAM_CHAT_ID}
  - key: CHECK_INTERVAL_MINUTES
    scope: RUN_TIME
    value: "15"
  - key: LOG_LEVEL
    scope: RUN_TIME
    value: INFO
  volumes:
  - name: data
    path: /app/data
  resource_limits:
    cpus: 512m
    memory_mb: 512
  restart_policy: ALWAYS
volumes:
- filesystem_type: EXT4
  name: data
  size_gib: 1
